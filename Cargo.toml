[package]
name = "sootmark-bsm"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "macOS and FreeBSD audit trails (BSM, OpenBSM) for forensics: every audited event with its subject, paths, arguments, sockets and return, read without libbsm."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/bsm"
homepage = "https://sootmark.com"
keywords = ["forensics", "dfir", "incident-response", "macos", "audit"]
# Sources only: test fixtures stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lib]
name = "bsm"

[dependencies]
common = { package = "sootmark-common", version = "0.3.5" }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
